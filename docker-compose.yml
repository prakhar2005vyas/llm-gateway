# Phase 1 — gateway + Postgres. Redis/Grafana/etc. join in their own phases.
#
# The gateway waits for Postgres via `condition: service_healthy`, but it also
# boots fine if the DB later dies (degraded: proxying continues, traces drop
# loudly — see app/main.py lifespan). DATABASE_URL set here points at the
# in-network `postgres` host and overrides any value from .env.

services:
  gateway:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-gateway_dev_pw}@postgres:5432/gateway
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway_dev_pw}
      POSTGRES_DB: gateway
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Lightweight by decree: the target dev machine has 16GB RAM total with
    # an IDE + Docker + everything else running (CLAUDE.md). 512MB is plenty
    # for a trace log at demo scale.
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    # Not published to the host by default — the gateway reaches it on the
    # compose network. Uncomment to inspect with psql/pgAdmin from the host:
    # ports:
    #   - "5432:5432"

volumes:
  pgdata:
