# Gateway + Postgres (Phase 1) + Prometheus/Grafana (Phase 7). All services
# share the default compose network — Prometheus scrapes `gateway:8000` by
# service name.
#
# The gateway waits for Postgres via `condition: service_healthy`, but it also
# boots fine if the DB later dies (degraded: proxying continues, traces drop
# loudly — see app/main.py lifespan). DATABASE_URL set here points at the
# in-network `postgres` host and overrides any value from .env.

services:
  gateway:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-gateway_dev_pw}@postgres:5432/gateway
      # Pinned explicitly so the rewrite fires even when .env is absent.
      # env_file supplies the same value; the environment block wins on conflict.
      UPSTREAM_MODEL_ID: ${UPSTREAM_MODEL_ID:-llama-3.3-70b-versatile}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Hard ceiling matches the 16GB-constrained target machine (CLAUDE.md).
    # Under OOM Docker kills this container cleanly before the OS OOM-killer
    # fires and takes down unrelated processes (Postgres, IDE, etc.).
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres:
    # pgvector build of Postgres 15 (Phase 3: semantic cache vectors). Same
    # Postgres core as before, plus the `vector` extension available to
    # CREATE EXTENSION at init.
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway_dev_pw}
      POSTGRES_DB: gateway
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Lightweight by decree: the target dev machine has 16GB RAM total with
    # an IDE + Docker + everything else running (CLAUDE.md). 512MB is plenty
    # for a trace log at demo scale.
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    # Not published to the host by default — the gateway reaches it on the
    # compose network. Uncomment to inspect with psql/pgAdmin from the host:
    # ports:
    #   - "5432:5432"

  # --- Phase 7: observability -------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - gateway
    restart: unless-stopped
    # Same 16GB-target frugality as postgres above: demo-scale scrape volume
    # needs nothing like Prometheus's default appetite.
    mem_limit: 256m

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      # Dashboards/datasources built in the UI survive a compose restart.
      - grafana-data:/var/lib/grafana
      # Provisioned config (Phase 7): Prometheus datasource + the LLM Gateway
      # dashboard load automatically — zero clicks after `docker compose up`.
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    mem_limit: 256m

volumes:
  pgdata:
  grafana-data:
