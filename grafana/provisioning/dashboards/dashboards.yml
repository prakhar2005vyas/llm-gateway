# Grafana dashboard provisioning (Phase 7): auto-load every dashboard JSON
# found in /var/lib/grafana/dashboards (bind-mounted from ./grafana/dashboards).
apiVersion: 1

providers:
  - name: default
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
